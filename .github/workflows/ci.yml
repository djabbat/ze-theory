name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --manifest-path simulations/quantum_4d/Cargo.toml
      - run: cargo clippy --manifest-path simulations/quantum_4d/Cargo.toml -- -D warnings
      - run: cargo build --release --manifest-path simulations/quantum_4d/Cargo.toml
